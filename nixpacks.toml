# Konfigurasi Nixpacks untuk deploy panel admin PHP native ini
# (contoh: Railway, atau platform lain yang memakai Nixpacks)

providers = ["php"]

[phases.setup]
nixPkgs = ["php81", "php81Extensions.pdo", "php81Extensions.pdo_mysql"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction || true"]

[start]
# Jalankan PHP built-in server, dokumen root di folder project ini.
# $PORT disediakan otomatis oleh platform (Railway, dll).
cmd = "php -S 0.0.0.0:$PORT -t ."
